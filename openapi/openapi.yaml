components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    RGB:
      type: object
      properties:
        r:
          type: integer
          minimum: 0
          maximum: 255
        g:
          type: integer
          minimum: 0
          maximum: 255
        b:
          type: integer
          minimum: 0
          maximum: 255
      required:
      - r
      - g
      - b
      additionalProperties: false
    RGBW:
      type: object
      properties:
        r:
          type: integer
          minimum: 0
          maximum: 255
        g:
          type: integer
          minimum: 0
          maximum: 255
        b:
          type: integer
          minimum: 0
          maximum: 255
        w:
          type: integer
          minimum: 0
          maximum: 255
      required:
      - r
      - g
      - b
      - w
      additionalProperties: false
    RGBWW:
      type: object
      properties:
        r:
          type: integer
          minimum: 0
          maximum: 255
        g:
          type: integer
          minimum: 0
          maximum: 255
        b:
          type: integer
          minimum: 0
          maximum: 255
        warmWhite:
          type: integer
          minimum: 0
          maximum: 255
        coolWhite:
          type: integer
          minimum: 0
          maximum: 255
      required:
      - r
      - g
      - b
      - warmWhite
      - coolWhite
      additionalProperties: false
    SegmentState:
      type: object
      properties:
        power: &id002
          type: boolean
        brightness: &id003
          type: number
          minimum: 0
          maximum: 100
        rgb: &id004
          $ref: '#/components/schemas/RGB'
        rgbw: &id005
          $ref: '#/components/schemas/RGBW'
        rgbww: &id006
          $ref: '#/components/schemas/RGBWW'
        colorTemperature: &id007
          type: integer
          minimum: 1
        effect: &id008
          type:
          - string
          - 'null'
      required: []
      additionalProperties: false
    DeviceState:
      type: object
      properties:
        power: *id002
        brightness: *id003
        rgb: *id004
        rgbw: *id005
        rgbww: *id006
        colorTemperature: *id007
        effect: *id008
        segments:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
              state:
                $ref: '#/components/schemas/SegmentState'
            required:
            - id
            - state
            additionalProperties: false
      required: []
      additionalProperties: false
      examples:
      - power: true
        brightness: 65
        rgb:
          r: 255
          g: 0
          b: 128
    Capability:
      oneOf:
      - $ref: '#/components/schemas/PowerCapability'
      - $ref: '#/components/schemas/BrightnessCapability'
      - $ref: '#/components/schemas/RgbCapability'
      - $ref: '#/components/schemas/RgbwCapability'
      - $ref: '#/components/schemas/RgbwwCapability'
      - $ref: '#/components/schemas/ColorTemperatureCapability'
      - $ref: '#/components/schemas/EffectsCapability'
      - $ref: '#/components/schemas/TransitionsCapability'
      - $ref: '#/components/schemas/SegmentsCapability'
      discriminator:
        propertyName: type
        mapping:
          power: '#/components/schemas/PowerCapability'
          brightness: '#/components/schemas/BrightnessCapability'
          rgb: '#/components/schemas/RgbCapability'
          rgbw: '#/components/schemas/RgbwCapability'
          rgbww: '#/components/schemas/RgbwwCapability'
          colorTemperature: '#/components/schemas/ColorTemperatureCapability'
          effects: '#/components/schemas/EffectsCapability'
          transitions: '#/components/schemas/TransitionsCapability'
          segments: '#/components/schemas/SegmentsCapability'
      examples:
      - type: colorTemperature
        minimum: 2200
        maximum: 6500
        step: 100
    PowerCapability:
      type: object
      properties:
        type:
          const: power
          type: string
      required:
      - type
      additionalProperties: false
    BrightnessCapability:
      type: object
      properties:
        type:
          const: brightness
          type: string
        minimum:
          type: number
        maximum:
          type: number
        step:
          type: number
          exclusiveMinimum: 0
      required:
      - type
      - minimum
      - maximum
      - step
      additionalProperties: false
    RgbCapability:
      type: object
      properties:
        type:
          const: rgb
          type: string
      required:
      - type
      additionalProperties: false
    RgbwCapability:
      type: object
      properties:
        type:
          const: rgbw
          type: string
      required:
      - type
      additionalProperties: false
    RgbwwCapability:
      type: object
      properties:
        type:
          const: rgbww
          type: string
      required:
      - type
      additionalProperties: false
    ColorTemperatureCapability:
      type: object
      properties:
        type:
          const: colorTemperature
          type: string
        minimum:
