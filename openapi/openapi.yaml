openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: OpenLight Gateway API
  version: 1.0.0
  description: Proposed v1 contract pending independent review. Local-first normalized
    lighting API. See docs/API.md for semantic validation, ordering, idempotency,
