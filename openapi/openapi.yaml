          - group
        id: *id001
      required:
      - type
      - id
      additionalProperties: false
    Command:
      type: object
      properties:
        state:
          $ref: '#/components/schemas/DeviceState'
          minProperties: 1
        transitionMs:
          type: integer
          minimum: 0
      required:
      - state
