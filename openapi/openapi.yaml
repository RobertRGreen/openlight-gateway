        type:
          const: effects
          type: string
        effectIds:
          type: array
          items:
            type: string
      required:
      - type
      - effectIds
      additionalProperties: false
    TransitionsCapability:
      type: object
      properties:
        type:
          const: transitions
          type: string
        maxDurationMs:
          type: integer
          minimum: 0
      required:
      - type
      - maxDurationMs
      additionalProperties: false
    SegmentsCapability:
      type: object
      properties:
        type:
          const: segments
          type: string
        segmentIds:
          type: array
          items:
            type: string
      required:
      - type
      - segmentIds
      additionalProperties: false
    StateSnapshot:
      type: object
      properties:
        state: &id021
          $ref: '#/components/schemas/DeviceState'
        observedAt: &id009
          type:
          - string
          - 'null'
          format: date-time
        stale: &id022
          type: boolean
        revision: &id023
          type: integer
          minimum: 0
      required:
      - state
      - observedAt
      - stale
      - revision
      additionalProperties: false
    Device:
      type: object
      properties:
        id: *id001
        name: &id010
          type: string
          minLength: 1
        manufacturer:
          type: string
        model:
          type:
          - string
          - 'null'
        adapter:
          type: string
        address:
          oneOf:
          - type: 'null'
          - type: object
            properties:
              transport:
                type: string
                enum:
                - lan
                - matter
                - bridge
                - cloud
                - mock
              endpoint:
                type:
                - string
                - 'null'
            required:
            - transport
            - endpoint
            additionalProperties: false
        room: &id011
          type:
          - string
          - 'null'
          format: uuid
        groups: &id012
          type: array
          items: *id001
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
        state:
          $ref: '#/components/schemas/DeviceState'
        stateObservedAt: *id009
        stateStale:
          type: boolean
        revision:
          type: integer
          minimum: 0
        availability:
          type: string
          enum:
          - online
          - offline
          - unknown
        metadata:
          type: object
          properties:
            extensions:
              type: object
              propertyNames:
                pattern: ^[a-z0-9-]+(\.[a-z0-9-]+)+$
              additionalProperties:
                type: object
          required:
          - extensions
          additionalProperties: false
      required:
      - id
      - name
      - manufacturer
      - model
      - adapter
      - address
      - room
      - groups
      - capabilities
      - state
      - stateObservedAt
      - stateStale
      - revision
      - availability
      - metadata
      additionalProperties: false
      examples:
      - id: 1c2bd3ee-7334-400e-8bc1-96c02bf16b45
        name: Desk lamp
        manufacturer: Mock
        model: RGB demo
        adapter: mock
        address:
          transport: mock
          endpoint: desk
        room: null
        groups: []
        capabilities:
        - type: power
        - type: brightness
          minimum: 0
          maximum: 100
          step: 1
        - type: rgb
        state:
          power: true
          brightness: 65
          rgb:
            r: 255
            g: 0
            b: 128
        stateObservedAt: '2026-09-17T18:00:00Z'
        stateStale: false
        revision: 3
        availability: online
        metadata:
          extensions: {}
    DevicePatch:
      type: object
      properties:
        name: *id010
        room: *id011
        groups: *id012
      required: []
      additionalProperties: false
      minProperties: 1
    Target:
